<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newspaper Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Applied before first paint so there is no flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="masthead">
    <div class="masthead-brand">
      <h1>Newspaper Agent</h1>
      <span class="eyebrow eyebrow--muted">Daily Digest &middot; Automated</span>
    </div>
    <div class="masthead-actions">
      <div class="stats" id="stats"></div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.5" />
          <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <div class="filters-search">
          <svg class="icon-search" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5" />
            <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input id="search" type="search" placeholder="Search&hellip;" />
          <span class="kbd">/</span>
        </div>

        <label class="field-label">Newspaper</label>
        <select id="newspaper">
          <option value="">All newspapers</option>
        </select>

        <label class="field-label">Category</label>
        <select id="category">
          <option value="">All categories</option>
        </select>

        <label class="field-label">Topic</label>
        <select id="topic">
          <option value="">All topics</option>
        </select>

        <label class="field-label">Date range</label>
        <div class="date-row">
          <input id="dateFrom" type="date" />
          <input id="dateTo" type="date" />
        </div>

        <label class="checkbox-label">
          <input id="unreadOnly" type="checkbox" checked />
          Unread only
        </label>

        <button id="clearFilters" class="btn btn--ghost btn--block">Clear filters</button>
      </div>
    </aside>

    <datalist id="categoryOptions"></datalist>
    <datalist id="topicOptions"></datalist>

    <main id="list" class="article-list">
      <p class="empty">Loading articles&hellip;</p>
    </main>
  </div>

  <footer class="pagination">
    <button id="prevPage" class="btn btn--icon-leading" aria-label="Previous page">
      <span class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Prev
    </button>
    <span id="pageInfo"></span>
    <button id="nextPage" class="btn btn--icon-trailing" aria-label="Next page">
      Next
      <span class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
